# Azure DevOps Pipeline
# Build Java application -> Publish artifact -> Build Docker image -> Push to ACR

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'
  imageRepository: 'java-app'
  containerRegistry: 'sanjeevimages.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

stages:

# ==========================================
# 1. BUILD JAVA APPLICATION
# ==========================================
- stage: Build
  displayName: Build

  jobs:
  - job: BuildJob
    displayName: Build Java Application

    pool:
      vmImage: ubuntu-latest

    steps:

    - task: Maven@4
      displayName: Maven Build
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        options: '-DskipTests'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '17'

    # Publish JAR as pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: Publish JAR Artifact
      inputs:
        targetPath: '$(Build.SourcesDirectory)/target'
        artifact: 'java-artifact'


# ==========================================
# 2. BUILD AND PUSH DOCKER IMAGE
# ==========================================
- stage: BuildImage
  displayName: Build Image

  dependsOn: Build

  jobs:
  - job: BuildImageJob
    displayName: Build and Push Docker Image

    pool:
      vmImage: ubuntu-latest

    steps:

    # Download artifact from Build stage
    - task: DownloadPipelineArtifact@2
      displayName: Download JAR Artifact
      inputs:
        artifact: 'java-artifact'
        path: '$(Build.SourcesDirectory)/target'

    # Build and push Docker image
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        command: buildAndPush
        containerRegistry: 'dockerserviceconnection'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)